<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>업종 날씨 아카이브</title><style>
:root{color-scheme:light dark;--bg:#fafaf8;--fg:#1d1d1b;--mut:#6b6b66;--line:#e2e1dc;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--fg:#ecebe6;--mut:#9d9c96;--line:#2e2d2a;--card:#1d1d1b}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.notice{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:.6rem 1rem;font-size:.85rem;color:var(--mut);text-align:center}
main{max-width:52rem;margin:0 auto;padding:1rem}
h1{font-size:1.4rem;margin:1rem 0}
section{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:1rem;margin:0 0 1.5rem}
section>h2{margin:0 0 .75rem;font-size:1.2rem}
figure{margin:0 0 1rem}figcaption{color:var(--mut);font-size:.85rem}
img{max-width:100%;height:auto;display:block;border-radius:4px}
.md h3,.md h4,.md h5,.md h6{margin:1rem 0 .4rem}
</style></head>
<body><div class="notice">무료 · 모두에게 같은 내용 · 투자 권유 아님 · 전망은 조건부 시나리오 · 순위·방향만 표시</div>
<main><h1>업종 날씨 아카이브</h1>
<p>아직 게시된 날짜가 없습니다.</p>
</main></body></html>
